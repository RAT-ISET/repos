name: Update DNF Repos
on:
  push:
    branches:
      - upload/**
    paths:
      - incoming/deb/**

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: software-repository
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check push
        run: |
          for file in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          do
            case "$file" in
              incoming/*)
                ;;
              *)
                echo "Illegal change: $file"
                exit 1
                ;;
            esac
          done

      - name: Install Tools
        run: apt install apt-utils gzip xz -y
      
      - name: Generate the Package Repo
        working-directory: deb
        run: apt-ftparchive generate repo.conf
      
      - name: Release the Package Repo
        working-directory: deb
        run: apt-ftparchive -c release.conf release dists/stable > dists/stable/Release
      
      - name: Sign the Repo
        working-directory: deb/dists/stable
        run: |
          echo "${{ secrets.GPG_KEY }}" | base64 -d > /tmp/private.key
          gpg --batch --import /tmp/private.key
          rm /tmp/private.key
          gpg --batch --yes \
            --default-key ${{ secrets.GPG_KEY_ID }} \
            --detach-sign \
            --o ./Release.gpg \
            ./Release
          gpg --batch --yes \
            --default-key ${{ secrets.GPG_KEY_ID }} \
            --detach-sign \
            --o ./InRelease \
            ./Release
      
      - name: Merge Repos
        run: |
          rm -rf incoming
          git add .
          git checkout main
          git pull --rebase origin main
          git commit -m "ci(rpm): Update the RPM Repository"
          BRANCH=${GITHUB_REF#refs/heads/}
          git merge ${BRANCH} --no-edit
          git push origin main
          git push origin --delete ${BRANCH}
